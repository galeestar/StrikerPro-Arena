<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas FC 27 | 3D Football Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; background: #070d19; color: #fff; user-select: none; }
    #hud {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10;
    }
    .scoreboard {
      display: flex; align-items: center; background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8; border-radius: 8px; overflow: hidden; font-weight: 800; font-size: 16px;
    }
    .team-h { background: #1d4ed8; padding: 8px 14px; }
    .score { padding: 8px 16px; background: #0f172a; color: #facc15; font-size: 18px; }
    .team-a { background: #b91c1c; padding: 8px 14px; }
    .controls {
      background: rgba(15, 23, 42, 0.85); border: 1px solid #334155;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; color: #e2e8f0;
    }
    #power-box {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: 260px; text-align: center; pointer-events: none; z-index: 10;
    }
    #power-bar-bg {
      width: 100%; height: 12px; background: rgba(255,255,255,0.2);
      border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3);
    }
    #power-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); }
    #goal-msg {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 64px; font-weight: 900; color: #facc15;
      text-shadow: 0 6px 28px rgba(0,0,0,0.9); display: none; pointer-events: none; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="scoreboard">
      <div class="team-h">ATLAS FC</div>
      <div class="score"><span id="s-home">0</span> - 0</div>
      <div class="team-a">REAL AI</div>
    </div>
    <div class="controls">
      <b>WASD / Arrows:</b> Move &nbsp;|&nbsp; <b>Shift:</b> Sprint &nbsp;|&nbsp;
      <b>Hold Space:</b> Shoot &nbsp;|&nbsp; <b>Q / E:</b> Curve &nbsp;|&nbsp; <b>R:</b> Reset
    </div>
  </div>

  <div id="goal-msg">GOOOAL!</div>

  <div id="power-box">
    <div style="font-size: 11px; font-weight: 700; margin-bottom: 4px;">SHOT POWER</div>
    <div id="power-bar-bg"><div id="power-fill"></div></div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070d19);
    scene.fog = new THREE.Fog(0x070d19, 70, 185);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xdbeafe, 1.15);
    light.position.set(30, 50, 25);
    light.castShadow = true;
    scene.add(light);

    // Pitch
    for (let i = 0; i < 14; i++) {
      const strip = new THREE.Mesh(
        new THREE.PlaneGeometry(68, 105 / 14),
        new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? 0x15803d : 0x166534, roughness: 0.85 })
      );
      strip.rotation.x = -Math.PI / 2;
      strip.position.z = -52.5 + (105 / 14) * (i + 0.5);
      strip.receiveShadow = true;
      scene.add(strip);
    }

    // Goal Frame
    const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const lPost = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.6), postMat);
    lPost.position.set(-4.2, 1.3, -52.5);
    const rPost = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.6), postMat);
    rPost.position.set(4.2, 1.3, -52.5);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 8.54), postMat);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, 2.6, -52.5);
    scene.add(lPost, rPost, bar);

    // Players (Using CylinderGeometry so Three.js r128 never crashes on CapsuleGeometry!)
    function makePlayer(color, x, z) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 1.8, 16),
        new THREE.MeshStandardMaterial({ color: color })
      );
      mesh.position.set(x, 0.9, z);
      mesh.castShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const striker = makePlayer(0x2563eb, 0, -16);
    const defender = makePlayer(0xdc2626, 2, -34);
    const keeper = makePlayer(0xf59e0b, 0, -51.5);

    // Ball
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    ball.castShadow = true;
    scene.add(ball);

    let ballPos = new THREE.Vector3(0, 0.32, -18);
    let ballVel = new THREE.Vector3(0, 0, 0);
    let spin = 0;
    let power = 0;
    let charging = false;
    let goals = 0;
    const keys = {};

    function resetPlay() {
      striker.position.set((Math.random() - 0.5) * 14, 0.9, -16);
      defender.position.set((Math.random() - 0.5) * 10, 0.9, -34);
      ballPos.set(striker.position.x, 0.32, striker.position.z - 2.0);
      ballVel.set(0, 0, 0);
      spin = 0;
    }

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space") charging = true;
      if (e.code === "KeyR") resetPlay();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
      if (e.code === "Space" && charging) {
        charging = false;
        if (striker.position.distanceTo(ballPos) < 2.6) {
          const dir = new THREE.Vector3().subVectors(ballPos, striker.position).setY(0).normalize();
          const speed = 16 + power * 30;
          ballVel.copy(dir.multiplyScalar(speed));
          ballVel.y = 3.2 + power * 7.5;
          if (keys["KeyQ"]) spin = -18;
          if (keys["KeyE"]) spin = 18;
        }
        power = 0;
        document.getElementById("power-fill").style.width = "0%";
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      const moveSpeed = (keys["ShiftLeft"] || keys["ShiftRight"]) ? 13.5 : 8.2;
      const move = new THREE.Vector3();
      if (keys["KeyW"] || keys["ArrowUp"]) move.z -= 1;
      if (keys["KeyS"] || keys["ArrowDown"]) move.z += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) move.x -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) move.x += 1;

      if (move.lengthSq() > 0) {
        move.normalize();
        striker.position.addScaledVector(move, moveSpeed * dt);
        if (striker.position.distanceTo(ballPos) < 1.4 && ballPos.y < 1.1) {
          ballVel.x = move.x * (moveSpeed * 1.15);
          ballVel.z = move.z * (moveSpeed * 1.15);
        }
      }

      if (charging) {
        power = Math.min(1, power + dt * 1.45);
        document.getElementById("power-fill").style.width = (power * 100) + "%";
      }

      // Defender AI
      const defDir = new THREE.Vector3().subVectors(ballPos, defender.position).setY(0);
      if (defDir.length() > 1.2 && ballPos.z < -20) {
        defDir.normalize();
        defender.position.addScaledVector(defDir, 4.0 * dt);
      }
      if (defender.position.distanceTo(ballPos) < 1.25) {
        ballVel.z = Math.abs(ballVel.z) * 0.7 + 6;
      }

      // Ball Physics
      ballVel.x += spin * (-ballVel.z * 0.025) * dt;
      spin *= 0.985;
      ballVel.y -= 19.6 * dt;
      ballPos.addScaledVector(ballVel, dt);

      if (ballPos.y <= 0.32) {
        ballPos.y = 0.32;
        ballVel.y = Math.abs(ballVel.y) > 1.2 ? -ballVel.y * 0.5 : 0;
        ballVel.x *= 0.96;
        ballVel.z *= 0.96;
      }

      // Goalkeeper AI
      const gkTarget = THREE.MathUtils.clamp(ballPos.x, -3.7, 3.7);
      keeper.position.x += (gkTarget - keeper.position.x) * 5.0 * dt;
      if (keeper.position.distanceTo(ballPos) < 1.35) {
        ballVel.z = Math.abs(ballVel.z) * 0.65 + 4;
      }

      // Goal Check
      if (ballPos.z < -52.5 && Math.abs(ballPos.x) < 4.1 && ballPos.y < 2.55) {
        goals++;
        document.getElementById("s-home").innerText = goals;
        const msg = document.getElementById("goal-msg");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 1800);
        resetPlay();
      }

      if (Math.abs(ballPos.x) > 36 || Math.abs(ballPos.z) > 56) resetPlay();

      ball.position.copy(ballPos);

      camera.position.lerp(new THREE.Vector3(striker.position.x * 0.45, 16.5, striker.position.z + 23), 5 * dt);
      camera.lookAt(ballPos.x * 0.5, 1.0, ballPos.z - 6);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
